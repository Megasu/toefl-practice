<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="TOEFL Listen and Choose a Best Response 听力专项练习。">
    <title>听力最佳回应 - TOEFL 备考系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="./listening.css?v=4">
</head>

<body class="h-screen flex flex-col overflow-hidden bg-[#f8fafc] text-slate-700 selection:bg-cyan-200">
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 z-50 h-16 shrink-0 flex items-center justify-between px-4 md:px-6 shadow-sm">
        <div class="flex items-center gap-3 min-w-0">
            <a href="./index.html" class="flex items-center gap-2 px-3 py-2 text-sm font-bold text-slate-500 hover:text-cyan-700 hover:bg-cyan-50 rounded-lg transition-colors" aria-label="返回 TOEFL 备考大厅">
                <span class="material-symbols-rounded text-xl" aria-hidden="true">arrow_back</span>
                <span class="hidden sm:inline">返回大厅</span>
            </a>
            <span class="h-6 w-px bg-slate-200" aria-hidden="true"></span>
            <button type="button" class="flex items-center gap-2 min-w-0" onclick="ListeningApp.restart()">
                <span class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-black text-sm shadow-sm shrink-0">T</span>
                <span class="text-left min-w-0">
                    <span class="block text-base md:text-xl font-extrabold text-slate-900 tracking-tight truncate">TOEFL 备考系统</span>
                    <span class="block text-[10px] md:text-xs font-bold text-cyan-700">听力最佳回应</span>
                </span>
            </button>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <span id="listening-header-status" class="text-xs font-bold bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full hidden md:block border border-slate-200">正在加载题库</span>
            <button type="button" onclick="ListeningApp.showHistory()" class="px-3 py-2 text-sm font-bold text-slate-500 hover:text-cyan-700 bg-slate-50 hover:bg-cyan-50 rounded-lg transition-colors">做题记录</button>
        </div>
    </header>

    <main id="listening-app" class="flex-1 min-h-0 relative overflow-hidden bg-[#f8fafc]" aria-live="polite"></main>
    <audio id="listening-audio" preload="metadata"></audio>
    <div id="listening-toast" class="listening-toast" role="status" aria-live="polite"></div>

    <script src="./listening.js?v=2" defer></script>
</body>

</html>
